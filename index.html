<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G.G. COOPER</title>
  <meta name="description" content="G.G. Cooper — Director & Editor based in Los Angeles.">
  <meta name="theme-color" content="#262922">

  <!-- Link previews (iMessage, Instagram, Slack, X, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="G.G. Cooper">
  <meta property="og:title" content="G.G. Cooper — Director & Editor">
  <meta property="og:description" content="Commercial, documentary and narrative work.">
  <meta property="og:url" content="https://ggcooper.com/">
  <meta property="og:image" content="https://ggcooper.com/thumbs/arcofathletethumbnail.png">
  <meta property="og:image:width" content="2000">
  <meta property="og:image:height" content="1125">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="G.G. Cooper — Director & Editor">
  <meta name="twitter:image" content="https://ggcooper.com/thumbs/arcofathletethumbnail.png">

  <link rel="icon" type="image/png" href="favicon.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="favicon-light.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="favicon.png">
  <!-- Two extra faces: IM Fell (Sinkhole tagline) and Fraunces (Creeker Day title) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Fraunces:opsz,wght@144,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Creek: drifting current lines + click ripples (decorative) -->
  <canvas id="creek" aria-hidden="true"></canvas>
  <canvas id="abyss" aria-hidden="true"></canvas>
  <canvas id="exposure" aria-hidden="true"></canvas>
  <div id="abyss-shade" aria-hidden="true"></div>
  <a href="#creeker" id="story-thread" class="story-thread" aria-label="Creeker Day">Happy Creeker Day</a>

  <!-- NAVIGATION -->
  <nav class="nav" id="nav">
    <a href="#home" class="nav-logo">G.G. COOPER</a>
    <div class="nav-links">
      <a href="#sinkhole"  class="nav-link nav-link-feature" data-section="sinkhole" hidden>Sinkhole</a>
      <a href="#about"    class="nav-link" data-section="about">About</a>
    </div>
  </nav>

  <!-- TICKER -->
  <div class="ticker-wrap" id="ticker">
    <div class="ticker-inner">
      <div class="ticker-set">
        <span>DIRECTOR</span><span class="dot"> &middot; </span>
        <span>EDITOR</span><span class="dot"> &middot; </span>
        <a href="#spring" class="ticker-egg">FILMMAKER</a><span class="dot"> &middot; </span>
        <span>DIRECTOR</span><span class="dot"> &middot; </span>
        <span>EDITOR</span><span class="dot"> &middot; </span>
        <a href="#spring" class="ticker-egg">FILMMAKER</a><span class="dot"> &middot; </span>
        <span>DIRECTOR</span><span class="dot"> &middot; </span>
        <span>EDITOR</span><span class="dot"> &middot; </span>
        <a href="#spring" class="ticker-egg">FILMMAKER</a><span class="dot"> &middot; </span>
      </div>
      <div class="ticker-set" aria-hidden="true">
        <span>DIRECTOR</span><span class="dot"> &middot; </span>
        <span>EDITOR</span><span class="dot"> &middot; </span>
        <a href="#spring" class="ticker-egg">FILMMAKER</a><span class="dot"> &middot; </span>
        <span>DIRECTOR</span><span class="dot"> &middot; </span>
        <span>EDITOR</span><span class="dot"> &middot; </span>
        <a href="#spring" class="ticker-egg">FILMMAKER</a><span class="dot"> &middot; </span>
        <span>DIRECTOR</span><span class="dot"> &middot; </span>
        <span>EDITOR</span><span class="dot"> &middot; </span>
        <a href="#spring" class="ticker-egg">FILMMAKER</a><span class="dot"> &middot; </span>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <main id="main">

    <!-- HOME: three words, nothing else -->
    <section id="sec-home" class="section home-section">
      <h1 class="visually-hidden">G.G. Cooper — Work</h1>
      <nav class="home-words" id="home-words" aria-label="Work"></nav>
      <div class="home-foot">
        <p class="holiday-note" id="holiday-note"></p>
        <a href="#sinkhole" class="home-feature" id="home-feature" aria-label="Sinkhole, feature film" hidden>
          <canvas class="hf-rings" aria-hidden="true"></canvas>
          <span class="hf-word" aria-hidden="true"></span>
        </a>
      </div>
    </section>

    <section id="sec-commercial" class="section work-section">
      <div class="cat-head"></div>
      <div class="video-grid" id="commercial-grid"></div>
    </section>

    <section id="sec-narrative" class="section work-section">
      <div class="cat-head"></div>
      <div class="video-grid" id="narrative-grid"></div>
    </section>

    <section id="sec-documentary" class="section work-section">
      <div class="cat-head"></div>
      <div class="video-grid" id="documentary-grid"></div>
    </section>

    <section id="sec-sinkhole" class="section sinkhole-section">
      <div id="sinkhole-content"></div>
    </section>

    <section id="sec-creeker" class="section creeker-section">
      <div id="creeker-content"></div>
    </section>

    <section id="sec-spring" class="section spring-section">
      <div id="spring-content"></div>
    </section>

    <section id="sec-spotlight" class="section spotlight-section">
      <div id="spotlight-content"></div>
    </section>

    <section id="sec-about" class="section about-section">
      <div id="about-content" class="about-content"></div>
    </section>

  </main>

  <!-- CURSOR LABEL (desktop): plain type that trails the cursor -->
  <div class="cursor-label" id="cursor-label" aria-hidden="true">
    <div class="cl-title" id="cl-title"></div>
    <div class="cl-meta" id="cl-meta"></div>
    <div class="cl-desc" id="cl-desc"></div>
  </div>

  <!-- Veil for the slow fade into One Afternoon in Summer -->
  <div id="veil" aria-hidden="true"></div>

  <!-- VIDEO MODAL -->
  <div class="modal" id="video-modal" role="dialog" aria-modal="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-box">
      <button class="modal-close" id="modal-close">Close</button>
      <div class="modal-video" id="modal-video"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
